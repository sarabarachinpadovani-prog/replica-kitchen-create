name: Deploy Factice Works to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install
      - name: Build static site
        timeout-minutes: 10
        run: bun run build
        env:
          CI: "true"
          GITHUB_PAGES_BUILD: "true"
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Keep only public files in dist
        run: |
          mv dist/client "$RUNNER_TEMP/site" && rm -rf dist && mv "$RUNNER_TEMP/site" dist
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
